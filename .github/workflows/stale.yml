name: Stale issues & PRs

on:
  schedule:
    - cron: '0 5 * * *'  # daily
  workflow_dispatch:

jobs:
  stale:
    # What stale-issues.yml declares, including the caches API actions/stale uses for its state.
    permissions:
      issues: write
      pull-requests: write
      actions: write
    uses: chodeus/chodeus-ops/.github/workflows/stale-issues.yml@c36f1a3c7e8108f86b3be0e19c5e0d08502f681f # main
