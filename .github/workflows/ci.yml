name: CI

# Build + test + smoke-load gate on every PR and on pushes to the mainline.
# build.yml only runs on tag pushes, so before this workflow no dotnet build,
# dotnet test, or smoke-load ran on ordinary code / dependency changes — they
# only failed later at release time. This mirrors the compile + smoke-load from
# build.yml (minus packaging/publishing) and adds the unit-test project, which
# is deliberately outside Sleezer.sln and so is run explicitly.

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_VERSION: '8.0.404'
  PLUGIN_NAME: 'Sleezer'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Pin SDK via global.json
        run: |
          echo '{"sdk":{"version": "${{ env.DOTNET_VERSION }}"}}' > ./global.json

      - name: Build solution
        run: |
          set -euo pipefail
          # NuGetAudit=false: upstream Lidarr submodule pins MailKit 4.14 with a
          # moderate advisory. Lidarr treats audit warnings as errors.
          dotnet restore ./*.sln -p:NuGetAudit=false
          dotnet build ./*.sln -c Release -p:NuGetAudit=false -p:CI="true" -v:n

      - name: Run tests
        run: |
          set -euo pipefail
          # Tests are intentionally excluded from Sleezer.sln (would drag ILRepack
          # + DeezNET into the plugin build graph), so run the project directly.
          dotnet test tests/${PLUGIN_NAME}.Tests/${PLUGIN_NAME}.Tests.csproj \
            -c Release -p:NuGetAudit=false

      - name: Smoke-load plugin
        run: |
          set -euo pipefail
          # Mirrors build.yml's smoke-load: verify the built plugin loads into a
          # Lidarr-shaped AssemblyLoadContext, catching BCL/transitive-dep
          # mismatches that make the plugin silently vanish from the UI.
          PLUGIN_OUTPUT_DIR=$(find . -type d -path "*/_plugins/*/${PLUGIN_NAME}" | head -n1)
          if [ -z "$PLUGIN_OUTPUT_DIR" ]; then
            echo "::error::Plugin output directory not found under */_plugins/*/${PLUGIN_NAME}"
            exit 1
          fi

          PLUGIN_DLL=$(find "$PLUGIN_OUTPUT_DIR" -name "Lidarr.Plugin.${PLUGIN_NAME}.dll" | head -n1)
          if [ -z "$PLUGIN_DLL" ]; then
            echo "::error::Plugin DLL not found under $PLUGIN_OUTPUT_DIR"
            exit 1
          fi

          HOST_DIR="$GITHUB_WORKSPACE/ext/Lidarr/_output/net8.0"
          if [ ! -d "$HOST_DIR" ]; then
            echo "::error::Lidarr host runtime dir not found at $HOST_DIR"
            exit 1
          fi

          # Built outside the plugin solution so it doesn't drag in the submodule.
          dotnet build tools/SmokeLoad/SmokeLoad.csproj -c Release -p:NuGetAudit=false --nologo
          dotnet run --project tools/SmokeLoad/SmokeLoad.csproj -c Release --no-build -- "$PLUGIN_DLL" "$HOST_DIR"
