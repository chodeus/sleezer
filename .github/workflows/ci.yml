name: CI

# Build + test gate on every PR and on pushes to the mainline.
# build.yml only runs on tag pushes, so before this workflow no dotnet build or
# dotnet test ran on ordinary code / dependency changes — they only failed later
# at release time. Smoke-load stays release-time (it needs the packaging build
# that produces _plugins/*/Sleezer); this gate compiles the solution and runs the
# unit-test project, which is deliberately outside Sleezer.sln and so run explicitly.

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_VERSION: '8.0.404'
  PLUGIN_NAME: 'Sleezer'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Pin SDK via global.json
        run: |
          echo '{"sdk":{"version": "${{ env.DOTNET_VERSION }}"}}' > ./global.json

      - name: Build solution
        run: |
          set -euo pipefail
          # NuGetAudit=false: upstream Lidarr submodule pins MailKit 4.14 with a
          # moderate advisory. Lidarr treats audit warnings as errors.
          dotnet restore ./*.sln -p:NuGetAudit=false
          dotnet build ./*.sln -c Release -p:NuGetAudit=false -p:CI="true" -v:n

      - name: Run tests
        run: |
          set -euo pipefail
          # Tests are intentionally excluded from Sleezer.sln (would drag ILRepack
          # + DeezNET into the plugin build graph), so run the project directly.
          dotnet test tests/${PLUGIN_NAME}.Tests/${PLUGIN_NAME}.Tests.csproj \
            -c Release -p:NuGetAudit=false
